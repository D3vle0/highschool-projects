<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0518-4 - box model</title>
</head>
<style>
    @font-face {
        font-family: "NanumBarunGothic";
        src: url("./assets/font/NanumBarunGothic.ttf");
    }

    body {
        font-family: "NanumBarunGothic";
    }

    div {
        border: 1px solid black;
    }

    .box1 {
        width: 400px;
        height: 100px;
        background-color: red;
        display: inline;
    }
    .box2{
        width: 50%;
        height: 100px;
        background-color: blue;
        display: inline;
    }
    div {
        border: 1px solid grey;
        margin: 10px;
    }
</style>

<body>
    <h1>0518-4 - box model</h1>
    <div>1234</div>
    <div>5678</div>
    <div class="box1">1234</div>
    <div class="box2">1234</div>
</body>

</html>
