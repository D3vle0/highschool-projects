<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0518-3 gradient</title>
</head>
<style>
    @font-face {
        font-family: "NanumBarunGothic";
        src: url("./assets/font/NanumBarunGothic.ttf");
    }

    body {
        font-family: "NanumBarunGothic";
    }

    .linear {
        background: linear-gradient(to bottom, blue, white 30%, skyblue);
        width: 300px;
        height: 300px;
    }

    .radial {
        background: radial-gradient(white, yellow, red);
        width: 300px;
        height: 300px;
    }

    .radial-2 {
        background: radial-gradient(circle closest-side at 30% 40%, white, yellow, green);
        width: 300px;
        height: 300px;
    }
</style>

<body>
    <h1>0518-3 gradient</h1>
    <div class="linear"></div>
    <p>linear-gradient</p><br>
    <div class="radial"></div>
    <p>radial-gradient</p><br>
    <div class="radial-2"></div>
    <p>radial-gradient2</p><br>
</body>

</html>
