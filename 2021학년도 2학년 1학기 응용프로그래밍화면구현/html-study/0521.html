<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0521-1 - inline과 block</title>
</head>
<style>
    @font-face {
        font-family: "NanumBarunGothic";
        src: url("./assets/font/NanumBarunGothic.ttf");
    }

    body {
        font-family: "NanumBarunGothic";
    }

    table{
        display: inline-table;
        /* display: inline-block; 똑같음*/
    }
</style>

<body>
    <h1>0521-1 - inline과 block</h1>
    <table border="1">
        <tr>
            <td style="display: none;">11</td>
            <td>22</td>
        </tr>
        <tr>
            <td>33</td>
            <td>44</td>
        </tr>
    </table>
    <table border="1">
        <tr>
            <td>11</td>
            <td>22</td>
        </tr>
        <tr>
            <td>33</td>
            <td>44</td>
        </tr>
    </table>
</body>

</html>
