<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0525 - margin</title>
</head>
<style>
    @font-face {
        font-family: "NanumBarunGothic";
        src: url("./assets/font/NanumBarunGothic.ttf");
    }

    body {
        font-family: "NanumBarunGothic";
    }

    div {
        width: 200px;
        height: 150px;
        display: inline-block;
    }

    .box1 {
        border: solid;
        margin: 10px 20px;
    }

    .box2 {
        border: dotted;
    }

    .box3 {
        border: dashed;
    }

    .box4 {
        border: solid;
        margin: 10px;
    }

    .box5 {
        border: dotted;
        margin: 30px;
    }

    .box6 {
        border: dashed;
    }
</style>

<body>
    <h1>0525 - margin</h1>
    <div class="box1">1</div>
    <div class="box2">2</div>
    <div class="box3">3</div><br><br>

    <div class="box4">4</div>
    <div class="box5">5</div>
    <div class="box6">6</div>
</body>

</html>
